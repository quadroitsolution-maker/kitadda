<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <!-- Soft shadow drop for high visibility on both light and dark themes -->
  <circle cx="14" cy="14" r="12" fill="#FFFFFF" stroke="#0A0D14" stroke-width="2"/>
  
  <!-- Center Pentagon -->
  <polygon points="14,9.5 17.8,12.3 16.3,17 11.7,17 10.2,12.3" fill="#0A0D14" stroke="#0A0D14" stroke-linejoin="round"/>
  
  <!-- Seam Lines radiating outwards -->
  <line x1="14" y1="9.5" x2="14" y2="2" stroke="#0A0D14" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="17.8" y1="12.3" x2="25" y2="10" stroke="#0A0D14" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16.3" y1="17" x2="21.5" y2="23.5" stroke="#0A0D14" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="11.7" y1="17" x2="6.5" y2="23.5" stroke="#0A0D14" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="10.2" y1="12.3" x2="3" y2="10" stroke="#0A0D14" stroke-width="1.6" stroke-linecap="round"/>
  
  <!-- Outer Pentagon patches -->
  <polygon points="11.5,2 14,2 16.5,2 15,4.5 13,4.5" fill="#0A0D14"/>
  <polygon points="25.5,10 26,13 23.5,15 22.5,12" fill="#0A0D14"/>
  <polygon points="21.5,23.5 18.5,25.5 16,23.5 18,21" fill="#0A0D14"/>
  <polygon points="6.5,23.5 9.5,25.5 12,23.5 10,21" fill="#0A0D14"/>
  <polygon points="2.5,10 2,13 4.5,15 5.5,12" fill="#0A0D14"/>
</svg>
